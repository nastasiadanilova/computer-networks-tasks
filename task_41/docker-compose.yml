version: "3.9"

services:
  router:
    image: alpine:3.19
    container_name: router
    command: >
      sh -c "
        apk add -no-cache iproute2 iputils &&
        sysctl -w net.ipv4.ip_forward=1 &&
        echo '[router] IP forwarding enabled' &&
        sleep infinity
      "
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_a:
        ipv4_address: 10.0.1.1
      net_b:
        ipv4_address: 10.0.2.1

  host_a:
    image: alpine:3.19
    container_name: host_a
    command: >
      sh -c "
        apk add -no-cache iputils &&
        ip route add 10.0.2.0/24 via 10.0.1.1 2>/dev/null || true &&
        echo '[host_a] ready' &&
        sleep infinity
      "
    cap_add:
      - NET_ADMIN
    networks:
      net_a:
        ipv4_address: 10.0.1.10
    depends_on:
      - router

  host_b:
    image: alpine:3.19
    container_name: host_b
    command: >
      sh -c "
        apk add -no-cache iputils &&
        ip route add 10.0.1.0/24 via 10.0.2.1 2>/dev/null || true &&
        echo '[host_b] ready' &&
        sleep infinity
      "
    cap_add:
      - NET_ADMIN
    networks:
      net_b:
        ipv4_address: 10.0.2.10
    depends_on:
      - router

networks:
  net_a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
  net_b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.2.0/24

