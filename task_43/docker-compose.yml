version: "3.9"

services:
  haproxy:
    image: haproxy:2.9-alpine
    container_name: haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:80"
      - "8404:8404"
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - backnet

  backend1:
    build: ./backend
    container_name: backend1
    environment:
      - BACKEND_NAME=backend1
      - PORT=8000
    networks:
      - backnet

  backend2:
    build: ./backend
    container_name: backend2
    environment:
      - BACKEND_NAME=backend2
      - PORT=8000
    networks:
      - backnet

  backend3:
    build: ./backend
    container_name: backend3
    environment:
      - BACKEND_NAME=backend3
      - PORT=8000
    networks:
      - backnet

networks:
  backnet:
    driver: bridge

