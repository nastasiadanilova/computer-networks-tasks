version: "3.9"

services:
  wg_a:
    image: linuxserver/wireguard:latest
    container_name: wg_a
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./wg_a:/config/wg_confs:ro
    networks:
      site_a:
        ipv4_address: 10.10.1.1
      transit:
        ipv4_address: 172.30.0.10
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  wg_b:
    image: linuxserver/wireguard:latest
    container_name: wg_b
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./wg_b:/config/wg_confs:ro
    networks:
      site_b:
        ipv4_address: 10.10.2.1
      transit:
        ipv4_address: 172.30.0.20
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  host_a:
    image: alpine:3.19
    container_name: host_a
    command: >
      sh -c "apk add -no-cache iputils &&
             ip route add 10.10.2.0/24 via 10.10.1.1 &&
             sleep infinity"
    cap_add: [NET_ADMIN]
    networks:
      site_a:
        ipv4_address: 10.10.1.10
    depends_on: [wg_a]

  host_b:
    image: alpine:3.19
    container_name: host_b
    command: >
      sh -c "apk add -no-cache iputils &&
             ip route add 10.10.1.0/24 via 10.10.2.1 &&
             sleep infinity"
    cap_add: [NET_ADMIN]
    networks:
      site_b:
        ipv4_address: 10.10.2.10
    depends_on: [wg_b]

networks:
  site_a:
    ipam: { config: [{ subnet: 10.10.1.0/24 }] }
  site_b:
    ipam: { config: [{ subnet: 10.10.2.0/24 }] }
  transit:
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }

